baseURL: "https://coldcasetech.com/"
languageCode: "en-us"
title: "ColdCase Tech"
theme: "PaperMod"
enableRobotsTXT: true

minify:
  disableJSON: true

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  env: production
  title: "ColdCase Tech"
  description: "Tracking tech and security stories long after the headlines fade."
  defaultTheme: dark
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  UseHugoToc: true
  TocOpen: true

  homeInfoParams:
    Title: "ColdCase Tech & Security Desk"
    Content: "Mainstream tech media abandons major stories after 48 hours. We track the aftermath—breach investigations, post-mortems, and regulatory fallout—months later."

menu:
  main:
    - identifier: posts
      name: Investigations
      url: /posts/
      weight: 10
    - identifier: radar
      name: Live CVE Radar
      url: /radar/
      weight: 15
    - identifier: tags
      name: Topics
      url: /tags/
      weight: 20
    - identifier: about
      name: Methodology
      url: /about/
      weight: 30