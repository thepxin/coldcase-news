baseURL: "https://coldcasetech.com/"
languageCode: "en-us"
title: "ColdCaseTech"
theme: "PaperMod"
enableRobotsTXT: true

minify:
  disableJSON: true

# Google News sitemap (articles from the last 2 days): /news-sitemap.xml
outputFormats:
  newssitemap:
    mediaType: application/xml
    baseName: news-sitemap
    isPlainText: false
    rel: sitemap
    noUgly: true
outputs:
  home: [HTML, RSS, newssitemap]

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  env: production
  title: "ColdCaseTech"
  description: "The daily record of tech promises: what's new across AI, chips, devices, software, space, EVs and energy, checked line by line against trusted sources, with one clear verdict when a promise comes due."
  defaultTheme: auto
  disableThemeToggle: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  UseHugoToc: true
  TocOpen: true

  mainSections: ["posts"]
  homeInfoParams:
    Title: "ColdCaseTech"
    Content: "What they promised. What actually happened."
  footer:
    text: "An independent record of technology's promises · [Our standards](/about/) · [editor@coldcasetech.com](mailto:editor@coldcasetech.com) · [Privacy & Terms](/privacy/) · [RSS](/index.xml)"

menu:
  main:
    - identifier: latest
      name: Latest
      url: /
      weight: 5
    - identifier: verdicts
      name: Verdicts
      url: /verdicts/
      weight: 10
    - identifier: developing
      name: Developing
      url: /developing/
      weight: 15
    - identifier: tech
      name: All articles
      url: /tags/tech/
      weight: 20
    - identifier: about
      name: How we verify
      url: /about/
      weight: 30
