baseURL: "https://coldcasetech.com/"
languageCode: "en-us"
title: "ColdCaseTech"
theme: "PaperMod"
enableRobotsTXT: true

minify:
  disableJSON: true

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  env: production
  title: "ColdCaseTech"
  description: "Tech promises and security incidents, checked against trusted sources: what was promised, what actually happened, and one clear verdict."
  defaultTheme: dark
  disableThemeToggle: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  UseHugoToc: true
  TocOpen: true

  mainSections: ["posts"]
  homeInfoParams:
    Title: "ColdCaseTech"
    Content: "What they promised. What actually happened."
  footer:
    text: "[How we verify](/about/) · [Privacy & Terms](/privacy/) · [Threat Radar](/radar/) · [RSS](/index.xml)"

menu:
  main:
    - identifier: tech
      name: Tech Cases
      url: /tags/tech/
      weight: 10
    - identifier: security
      name: Security Friday
      url: /tags/security-friday/
      weight: 15
    - identifier: developing
      name: Developing
      url: /developing/
      weight: 17
    - identifier: radar
      name: Threat Radar
      url: /radar/
      weight: 20
    - identifier: about
      name: How we verify
      url: /about/
      weight: 30
