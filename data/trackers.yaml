# Promise trackers: one page per company at /tracker/<slug>/, built automatically from the articles.
# "match" = words that mean an article is about this company, checked in the HEADLINE only (headlines name the main
#           company first; a passing mention such as "also on Xbox" does not count). Lowercase; "|" separates alternatives.
# A tracker page is listed on /tracker/ and in Google once it has at least 2 articles.
# To add a company: copy a block, change the four lines, upload this file.
- slug: apple
  name: Apple
  match: "apple|iphone|ipad|macbook|imac|mac mini|mac studio|siri|airpods|vision pro|ios \\d+|macos|watchos"
  about: "iPhone, iPad, Mac, Siri and Apple Intelligence"
- slug: nvidia
  name: NVIDIA
  match: "nvidia|geforce|rtx \\d+|rtx spark|cuda|cudss|blackwell|dgx"
  about: "GeForce and RTX graphics, GeForce NOW, AI chips and software"
- slug: openai
  name: OpenAI
  match: "openai|chatgpt|codex|gpt-\\d|sora"
  about: "ChatGPT, GPT models, Codex and Sora"
