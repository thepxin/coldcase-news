name: Publish Approved Case

# Runs when you merge a review pull request (any push to main that ADDS a post).
# The site itself is built by Cloudflare on that same push; this job then shares
# the new post to Dev.to and Hashnode and pings IndexNow once the page is live.
on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'

permissions:
  contents: read

jobs:
  syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find posts added by this push
        id: find
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          NEW_POSTS=$(git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" -- content/posts | tr '\n' ' ')
          echo "New posts: ${NEW_POSTS:-none}"
          echo "posts=$NEW_POSTS" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.find.outputs.posts != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syndicate to Dev.to / Hashnode and ping IndexNow
        if: steps.find.outputs.posts != ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUB_ID: ${{ secrets.HASHNODE_PUB_ID }}
        run: |
          pip install requests
          python scripts/syndicate.py ${{ steps.find.outputs.posts }}
