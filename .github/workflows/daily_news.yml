name: Daily Cold-Case News Generator

# Every day: one TECH case (promised vs delivered), published directly after passing every check.
# On Security Friday: also ONE SECURITY case, opened as a pull request for your manual review.
on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      desk:
        description: 'Which desk to run (auto = tech daily, plus security on Security Friday)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, tech, security]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find, write and verify today's case(s)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECURITY_DAY: Friday
          DESK: ${{ inputs.desk || 'auto' }}
        run: python scripts/generate_followup.py

      - name: Publish the tech case
        id: push
        run: |
          git config user.name "FollowUp Editorial Bot"
          git config user.email "bot@coldcasetech.com"
          TECH_FILE=$(python -c "import json;print(json.load(open('run_result.json')).get('tech',''))" 2>/dev/null || true)
          if [ -z "$TECH_FILE" ]; then
            echo "No tech case today."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add "$TECH_FILE" scripts/latest_social_teaser.txt
          git commit -m "chore(content): publish new automated investigation"
          git pull --rebase origin main
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "file=$TECH_FILE" >> "$GITHUB_OUTPUT"

      - name: Open the Security Friday case for your review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SEC_FILE=$(python -c "import json;print(json.load(open('run_result.json')).get('security',''))" 2>/dev/null || true)
          if [ -z "$SEC_FILE" ]; then
            echo "No security case to review today."
            exit 0
          fi
          BRANCH="review/security-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          TITLE="$(python scripts/make_pr_body.py)"
          git checkout -b "$BRANCH"
          git add "$SEC_FILE"
          git commit -m "draft: ${TITLE}"
          git push origin "$BRANCH"
          if gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr_body.md \
               --reviewer "${{ github.repository_owner }}"; then
            echo "Review pull request opened."
          elif gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr_body.md; then
            echo "Review pull request opened (without a review request)."
          else
            echo "::warning::Could not open the pull request. Turn on Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'. The draft is safe on branch $BRANCH."
          fi
          git checkout main

      - name: Share yesterday's posts to Dev.to / Hashnode (24-hour delay)
        # Posts go out about a day after publishing, so any fix you make on the site is included.
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUB_ID: ${{ secrets.HASHNODE_PUB_ID }}
        run: python scripts/syndicate.py --due

      - name: Save the syndication log
        run: |
          git add scripts/syndicated.json
          if git diff --staged --quiet; then
            echo "Syndication log unchanged."
          else
            git commit -m "chore(syndication): update shared-posts log"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then break; fi
              sleep 15
            done
          fi

      - name: Ping IndexNow for today's tech case
        if: steps.push.outputs.published == 'true'
        run: python scripts/syndicate.py --indexnow "${{ steps.push.outputs.file }}"
