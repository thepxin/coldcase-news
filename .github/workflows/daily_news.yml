name: Daily Cold-Case News Generator

# Three tech articles a day, ONE PER RUN, spread out so the site has fresh news morning, afternoon and night:
#   02:41 UTC = 08:11 IST (morning)   08:41 UTC = 14:11 IST (afternoon)   14:41 UTC = 20:11 IST (night)
#   17:47 UTC = 23:17 IST: catch-up, publishes any article an earlier run could not (Claude busy, GitHub late).
# Each run picks the HOTTEST story it can verify (most outlets covering it, freshest, trending on Google / Hacker
# News), from a field that has no article yet today. Case updates run once a day, in the first run; cases that had
# new coverage but no free slot get one more update in later runs, after the article.
# Everything is published directly, but only after passing every automated check (approved sources, hard checks,
# and a clean, separate AI fact-check). Nothing that fails a check is ever published.
# GitHub always uses UTC, and often starts its own scheduled runs hours late. So the on-time start comes from a
# Cloudflare timer (scripts/cloudflare_timer.js), which presses "Run workflow" at the times below with run_kind
# slot or catchup. GitHub's own schedule stays as a backup: a run that finds today's article already published
# publishes nothing more.
# All runs of the day share one daily request cap (data/daily_runs.json).
on:
  schedule:
    - cron: '41 2 * * *'
    - cron: '41 8 * * *'
    - cron: '41 14 * * *'
    - cron: '47 17 * * *'
  workflow_dispatch:
    inputs:
      desk:
        description: 'What to run (auto = case updates if not done today, then 1 article if one is still missing today; tech = 1 extra article now)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, updates, tech]
      run_kind:
        description: 'Leave as manual. (slot and catchup are used by the Cloudflare timer)'
        required: false
        default: 'manual'
        type: choice
        options: [manual, slot, catchup]

permissions:
  contents: write

# never run two of these at the same time (a late first run and the catch-up run wait for each other)
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # latest version, even if this run waited in the queue
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find, write and verify today's case(s)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Half-price Claude batches. To switch off: Settings > Secrets and variables > Actions > Variables,
          # add CLAUDE_BATCH with the value off (delete it to switch back on).
          CLAUDE_BATCH: ${{ vars.CLAUDE_BATCH || 'on' }}
          DESK: ${{ inputs.desk || 'auto' }}
          # slot = a timed run (1 article), catchup = the 23:17 IST run (all missing articles), manual = Run workflow button
          # (the Cloudflare timer uses the Run workflow button too, with run_kind slot or catchup)
          RUN_KIND: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_kind || 'manual') || (github.event.schedule == '47 17 * * *' && 'catchup' || 'slot') }}
        run: python scripts/generate_followup.py

      - name: Keep the Reel voice model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/coldcase-reel
          key: coldcase-reel-kokoro-v1.0

      - name: Make a Reel for each new article
        # A 15-second vertical video per new article (scripts/reel.py): its fact-checked 3-line script, read by a free
        # open-source AI voice over music made from scratch. A bonus only: if this fails, the article still publishes
        # and Instagram gets the picture post.
        continue-on-error: true
        timeout-minutes: 15
        run: |
          FILES=$(python -c "import json;v=json.load(open('run_result.json')).get('tech',[]);print(' '.join(v if isinstance(v,list) else [v]))" 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "No new articles, so no Reels."; exit 0; fi
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          pip install -q kokoro-onnx soundfile fonttools brotli
          python scripts/reel.py $FILES

      - name: Publish today's cases and case updates
        id: push
        run: |
          git config user.name "FollowUp Editorial Bot"
          git config user.email "bot@coldcasetech.com"
          read_result() { python -c "import json;v=json.load(open('run_result.json')).get('$1','');print(' '.join(v) if isinstance(v,list) else v)" 2>/dev/null || true; }
          FILES=""
          for F in $(read_result tech) $(read_result update); do
            git add "$F"; FILES="$FILES $F"
          done
          if [ -f scripts/latest_social_teaser.txt ]; then git add scripts/latest_social_teaser.txt; fi
          # the new Reels (and old ones removed after 21 days)
          if [ -d static/reels ]; then git add -A static/reels; fi
          # "last checked" dates for open cases, and today's job log (used by the catch-up run)
          if [ -f data/case_checks.json ]; then git add data/case_checks.json; fi
          if [ -f data/daily_runs.json ]; then git add data/daily_runs.json; fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          if git diff --staged --quiet; then
            echo "Nothing to publish today."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="chore(content): daily run"
          N=$(echo $(read_result tech) | wc -w)
          [ "$N" -gt 0 ] && MSG="$MSG; $N new tech article(s)"
          [ -n "$(read_result update)" ] && MSG="$MSG; case update"
          git commit -m "$MSG"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin main && git push origin main; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          if [ -n "$FILES" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi

      - name: Email the verdict to readers who asked for it
        # "Email me the verdict" on open case pages. One Kit email per closed case, only to readers who asked.
        # To review before sending: Settings > Secrets and variables > Actions > Variables, VERDICT_EMAIL_MODE = draft
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          VERDICT_EMAIL_MODE: ${{ vars.VERDICT_EMAIL_MODE || 'send' }}
        run: |
          python scripts/verdict_alerts.py || echo "Verdict emails had a problem (see above); the site is not affected."
          if [ -f data/verdict_alerts.json ]; then
            git add data/verdict_alerts.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(email): verdict emails log"
              for attempt in 1 2 3; do
                if git pull --rebase --autostash -X theirs origin main && git push origin main; then break; fi
                git rebase --abort 2>/dev/null || true
                sleep 15
              done
            fi
          fi

      - name: Share new posts to Dev.to
        # Each new post goes out as soon as it is live on the site (copies link back to it as the original).
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python scripts/syndicate.py --due

      - name: Save the syndication log
        run: |
          git add scripts/syndicated.json
          if git diff --staged --quiet; then
            echo "Syndication log unchanged."
          else
            git commit -m "chore(syndication): update shared-posts log"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push origin main; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
          fi

      - name: Ping IndexNow for today's new and updated pages
        if: steps.push.outputs.published == 'true'
        run: python scripts/syndicate.py --indexnow ${{ steps.push.outputs.files }}
