name: Daily Cold-Case News Generator

on:
  schedule:
    - cron: "0 6 * * *" # Runs daily at 06:00 UTC (11:30 AM IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate follow-up article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUB_ID: ${{ secrets.HASHNODE_PUB_ID }}
         
        run: python scripts/generate_followup.py

      - name: Save and push article to repository
        run: |
          git config user.name "FollowUp Editorial Bot"
          git config user.email "bot@followupdesk.local"
          git add content/posts/ scripts/latest_social_teaser.txt
          if ! git diff --staged --quiet; then
            git commit -m "Publish new automated follow-up article"
            git pull origin main --rebase -X theirs
            git push origin main
          else
            echo "No new article generated today; skipping push."
          fi
