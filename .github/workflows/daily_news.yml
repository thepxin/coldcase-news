name: Daily Cold-Case News Generator

# Writes one article a day and opens a pull request for you to review.
# Nothing goes live until you tap "Merge" (works in the GitHub phone app).
# Publishing and syndication then happen in publish.yml.
on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-for-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate follow-up article (Gemini first, free Groq fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_followup.py

      - name: Open a pull request for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "FollowUp Editorial Bot"
          git config user.email "bot@coldcasetech.com"
          # Only the post goes into the pull request; the social posts are shown in the PR text instead.
          git add content/posts/
          if git diff --staged --quiet; then
            echo "No new article generated today; nothing to review."
            exit 0
          fi
          BRANCH="review/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          TITLE="$(python scripts/make_pr_body.py)"
          git checkout -b "$BRANCH"
          git commit -m "draft: ${TITLE}"
          git push origin "$BRANCH"
          if gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr_body.md \
               --reviewer "${{ github.repository_owner }}"; then
            echo "Pull request opened (review requested from ${{ github.repository_owner }})."
          elif gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr_body.md; then
            echo "Pull request opened (without a review request)."
          else
            echo "::error::Could not open the pull request. Turn on: Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests'. The draft is safe on branch $BRANCH; open it from the repo's Pull requests tab."
            exit 1
          fi
