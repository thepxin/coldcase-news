name: Daily Cold-Case News Generator

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate follow-up article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_followup.py

      - name: Save and push article to repository
        run: |
          git config user.name "FollowUp Editorial Bot"
          git config user.email "bot@followupdesk.local"
          git add -A
          git diff --staged --quiet || git commit -m "Publish new automated follow-up article"
          git pull origin main --rebase --autostash
          git push origin main