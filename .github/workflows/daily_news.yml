name: Daily Cold-Case News Generator

# Three tech articles a day, ONE PER RUN, spread out so the site has fresh news morning, afternoon and night:
#   02:41 UTC = 08:11 IST (morning)   08:41 UTC = 14:11 IST (afternoon)   14:41 UTC = 20:11 IST (night)
#   17:47 UTC = 23:17 IST: catch-up, publishes any article an earlier run could not (Claude busy, GitHub late).
# Each run picks the HOTTEST story it can verify (most outlets covering it, freshest, trending on Google / Hacker
# News), from a field that has no article yet today. Case updates run once a day, in the first run.
# Everything is published directly, but only after passing every automated check (approved sources, hard checks,
# and a clean, separate AI fact-check). Nothing that fails a check is ever published.
# GitHub always uses UTC, and often starts scheduled runs 5 to 60 minutes late; a late run still publishes.
# All runs of the day share one daily request cap (data/daily_runs.json).
on:
  schedule:
    - cron: '41 2 * * *'
    - cron: '41 8 * * *'
    - cron: '41 14 * * *'
    - cron: '47 17 * * *'
  workflow_dispatch:
    inputs:
      desk:
        description: 'What to run (auto = case updates if not done today, then 1 article if one is still missing today; tech = 1 extra article now)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, updates, tech]

permissions:
  contents: write

# never run two of these at the same time (a late first run and the catch-up run wait for each other)
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # latest version, even if this run waited in the queue
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find, write and verify today's case(s)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DESK: ${{ inputs.desk || 'auto' }}
          # slot = a timed run (1 article), catchup = the 23:17 IST run (all missing articles), manual = Run workflow button
          RUN_KIND: ${{ github.event_name == 'workflow_dispatch' && 'manual' || (github.event.schedule == '47 17 * * *' && 'catchup' || 'slot') }}
        run: python scripts/generate_followup.py

      - name: Publish today's cases and case updates
        id: push
        run: |
          git config user.name "FollowUp Editorial Bot"
          git config user.email "bot@coldcasetech.com"
          read_result() { python -c "import json;v=json.load(open('run_result.json')).get('$1','');print(' '.join(v) if isinstance(v,list) else v)" 2>/dev/null || true; }
          FILES=""
          for F in $(read_result tech) $(read_result update); do
            git add "$F"; FILES="$FILES $F"
          done
          if [ -f scripts/latest_social_teaser.txt ]; then git add scripts/latest_social_teaser.txt; fi
          # "last checked" dates for open cases, and today's job log (used by the catch-up run)
          if [ -f data/case_checks.json ]; then git add data/case_checks.json; fi
          if [ -f data/daily_runs.json ]; then git add data/daily_runs.json; fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          if git diff --staged --quiet; then
            echo "Nothing to publish today."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="chore(content): daily run"
          N=$(echo $(read_result tech) | wc -w)
          [ "$N" -gt 0 ] && MSG="$MSG; $N new tech article(s)"
          [ -n "$(read_result update)" ] && MSG="$MSG; case update"
          git commit -m "$MSG"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin main && git push origin main; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          if [ -n "$FILES" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi

      - name: Share new posts to Dev.to / Hashnode
        # Each new post goes out as soon as it is live on the site (copies link back to it as the original).
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUB_ID: ${{ secrets.HASHNODE_PUB_ID }}
        run: python scripts/syndicate.py --due

      - name: Save the syndication log
        run: |
          git add scripts/syndicated.json
          if git diff --staged --quiet; then
            echo "Syndication log unchanged."
          else
            git commit -m "chore(syndication): update shared-posts log"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push origin main; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
          fi

      - name: Ping IndexNow for today's new and updated pages
        if: steps.push.outputs.published == 'true'
        run: python scripts/syndicate.py --indexnow ${{ steps.push.outputs.files }}
