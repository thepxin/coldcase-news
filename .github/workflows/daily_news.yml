name: Daily Cold-Case News Generator

# Every day, in this order (no job skips another):
#   1. Case updates: new verified facts for open and recent cases
#   2. Up to 3 TECH articles, each from a different field: news reports, open cases and verdict cases
# Everything is published directly, but only after passing every automated check (approved sources, hard checks,
# and a clean, separate AI fact-check). Nothing that fails a check is ever published.
# Times are UTC (GitHub always uses UTC): 14:30 UTC = 20:00 IST, 17:47 UTC = 23:17 IST.
# The second run is a catch-up: it only redoes jobs that did not finish (Claude overloaded, or GitHub skipped
# the first run). Finished jobs are skipped, and all runs of the day share one daily request cap (data/daily_runs.json).
on:
  schedule:
    - cron: '30 14 * * *'
    - cron: '47 17 * * *'
  workflow_dispatch:
    inputs:
      desk:
        description: 'What to run (auto = updates, then up to 3 tech articles)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, updates, tech]

permissions:
  contents: write

# never run two of these at the same time (a late first run and the catch-up run wait for each other)
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find, write and verify today's case(s)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESK: ${{ inputs.desk || 'auto' }}
        run: python scripts/generate_followup.py

      - name: Publish today's cases and case updates
        id: push
        run: |
          git config user.name "FollowUp Editorial Bot"
          git config user.email "bot@coldcasetech.com"
          read_result() { python -c "import json;v=json.load(open('run_result.json')).get('$1','');print(' '.join(v) if isinstance(v,list) else v)" 2>/dev/null || true; }
          FILES=""
          for F in $(read_result tech) $(read_result update); do
            git add "$F"; FILES="$FILES $F"
          done
          if [ -f scripts/latest_social_teaser.txt ]; then git add scripts/latest_social_teaser.txt; fi
          # "last checked" dates for open cases, and today's job log (used by the catch-up run)
          if [ -f data/case_checks.json ]; then git add data/case_checks.json; fi
          if [ -f data/daily_runs.json ]; then git add data/daily_runs.json; fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          if git diff --staged --quiet; then
            echo "Nothing to publish today."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="chore(content): daily run"
          N=$(echo $(read_result tech) | wc -w)
          [ "$N" -gt 0 ] && MSG="$MSG; $N new tech article(s)"
          [ -n "$(read_result update)" ] && MSG="$MSG; case update"
          git commit -m "$MSG"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then break; fi
            sleep 15
          done
          if [ -n "$FILES" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi

      - name: Share yesterday's posts to Dev.to / Hashnode (24-hour delay)
        # Posts go out about a day after publishing, so any fix you make on the site is included.
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUB_ID: ${{ secrets.HASHNODE_PUB_ID }}
        run: python scripts/syndicate.py --due

      - name: Save the syndication log
        run: |
          git add scripts/syndicated.json
          if git diff --staged --quiet; then
            echo "Syndication log unchanged."
          else
            git commit -m "chore(syndication): update shared-posts log"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin main; then break; fi
              sleep 15
            done
          fi

      - name: Ping IndexNow for today's new and updated pages
        if: steps.push.outputs.published == 'true'
        run: python scripts/syndicate.py --indexnow ${{ steps.push.outputs.files }}
