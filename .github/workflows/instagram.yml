name: Post to Instagram

# Posts each new article to Instagram (image + fact-checked caption) through Instagram's official API.
# Runs right after the daily article run finishes, and every 4 hours as a backup. Does nothing until the
# IG_ACCESS_TOKEN secret exists. Never posts the same article twice (data/instagram_log.json).
on:
  workflow_run:
    workflows: ["Daily Cold-Case News Generator"]
    types: [completed]
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'post = post new articles · dry-run = only show what would be posted · skip-existing = mark current articles as done without posting'
        required: false
        default: 'post'
        type: choice
        options: [post, dry-run, skip-existing]

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Post new articles
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          IG_MODE: ${{ inputs.mode || 'post' }}
        run: |
          git pull --quiet origin main || true
          python scripts/instagram.py

      - name: Save the posting log
        if: always()
        run: |
          [ -f data/instagram_log.json ] || exit 0
          git config user.name "FollowUp Editorial Bot"
          git config user.email "bot@coldcasetech.com"
          git add data/instagram_log.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore(instagram): record posts"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then break; fi
            sleep 15
          done
