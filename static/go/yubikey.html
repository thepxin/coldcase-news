<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to Partner Store...</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>body{background:#fbfaf7;color:#6a707d;font-family:ui-monospace,monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;padding:0 16px;text-align:center}@media (prefers-color-scheme:dark){body{background:#0f1115;color:#9a9fab}}</style>
  <script>
    (function() {
      var tz = "";
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e) {}
      var lang = (navigator.language || "").toLowerCase();
      var domain = "www.amazon.com";
      var tag = "coldcasetech-20"; // Default US/Global Associate Tag

      if (tz === "Asia/Kolkata" || tz === "Asia/Calcutta" || lang.indexOf("-in") !== -1) {
        domain = "www.amazon.in";
        tag = "coldcasetech-21"; // Your active India Associate Tag
      }
      /* Everyone else goes to Amazon.com, where our US tag earns. (A US tag earns nothing on Amazon.co.uk/.de/.ca.) */

      /* The product page (ASIN B07HBD7135) is Amazon.com's; on Amazon.in the same ID may not exist, so India gets a search. */
      var path = domain === "www.amazon.in" ? "/s?k=yubikey+5+nfc" : "/dp/B07HBD7135";
      var target = "https://" + domain + path + (path.indexOf("?") !== -1 ? "&" : "?") + "tag=" + tag;
      try { navigator.sendBeacon('https://coldcasetech.goatcounter.com/count?p=/go/yubikey&t=Affiliate_Click_yubikey'); } catch(e) {}
      window.location.replace(target);
    })();
  </script>
</head>
<body>Redirecting to verified hardware partner...</body>
</html>
