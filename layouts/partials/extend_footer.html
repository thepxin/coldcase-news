<script>
/* "3 h ago" for <time class="cct-ago">; the absolute UTC time stays as fallback and tooltip */
(function(){var t=document.querySelectorAll('time.cct-ago');if(!t.length)return;var n=Date.now();
t.forEach(function(e){var d=Date.parse(e.getAttribute('datetime'));if(isNaN(d))return;var m=Math.max(0,Math.round((n-d)/60000));
e.title=e.textContent;e.textContent=m<60?(m<2?'just now':m+' min ago'):(m<2880?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago');});})();
</script>
<script>
/* Newsletter (Kit form 10077030). Works for every .cct-news-form on the page.
   mode:'no-cors' sends the signup once without needing Kit to allow cross-site reads;
   if the network call fails completely, the normal form post opens in a new tab instead. */
document.addEventListener('submit', async function (e) {
  var form = e.target;
  if (!form.classList || !form.classList.contains('cct-news-form')) return;
  e.preventDefault();
  var input = form.querySelector('input[type=email]');
  var btn = form.querySelector('button');
  var msg = form.parentNode.querySelector('.cct-news-msg');
  var email = (input.value || '').trim();
  if (!email) return;
  btn.disabled = true;
  btn.textContent = 'Sending...';
  try {
    await fetch(form.action, { method: 'POST', body: new FormData(form), mode: 'no-cors' });
  } catch (err) {
    form.target = '_blank';
    form.submit();
  }
  try {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ path: 'newsletter-signup-' + (form.dataset.place || 'page'), title: 'Newsletter signup', event: true });
    }
  } catch (err) {}
  input.value = '';
  btn.textContent = 'Check your inbox';
  msg.hidden = false;
  msg.textContent = 'Almost done: open the email we just sent to ' + email + ' and click the confirm link. Your checklist link is in that email.';
});
</script>
