{{- /* Desk label: Tech (daily) or Security Friday (weekly). Older posts without a desk show nothing. */ -}}
{{- $d := .Params.desk -}}
{{- if eq $d "tech" -}}
<a class="cct-chip cct-chip--tech" href="{{ "tags/tech/" | relURL }}"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4 0v2M8 0v2M4 10v2M8 10v2M0 4h2M0 8h2M10 4h2M10 8h2" stroke="currentColor" stroke-width="1.1"/></svg>Tech</a>
{{- else if eq $d "security" -}}
<a class="cct-chip cct-chip--sec" href="{{ "tags/security-friday/" | relURL }}"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .8 10.5 2.5v3.3c0 2.8-2 4.8-4.5 5.6C3.5 10.6 1.5 8.6 1.5 5.8V2.5Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>Security Friday</a>
{{- end -}}
