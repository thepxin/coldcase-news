{{- /* Compact ColdCase Weekly sign-up (same Kit form and script as the big newsletter box). */ -}}
<section class="cct-feed cct-rail-news" aria-labelledby="rail-news">
  <h2 id="rail-news">ColdCase Weekly</h2>
  <p class="cct-rail-news-t">Every verdict, once a week. Free, with our field guide <i>The Fine Print</i>.</p>
  <form class="cct-news-form" data-place="rail" action="https://app.kit.com/forms/10077030/subscriptions" method="post">
    <label class="cct-sr" for="cct-email-rail">Email address</label>
    <input type="email" id="cct-email-rail" name="email_address" required autocomplete="email" placeholder="you@example.com">
    <button type="submit" class="cct-btn-money">Subscribe</button>
  </form>
  <div class="cct-news-msg" role="status" aria-live="polite" hidden></div>
</section>
